<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitud recibida | QAL Agentes Inmobiliarios</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#151013">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700&family=Jost:wght@300;400;500&display=swap">
  <style>
    :root{
      --bg:#151013; --ink:#F2E7DE; --mute:#BCA69F; --oro:#DFCA9B; --linea:#3A2C34;
      --serif:'Bodoni Moda',Georgia,serif; --sans:'Jost','Helvetica Neue',Arial,sans-serif;
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100svh; background:var(--bg); color:var(--ink);
      font-family:var(--sans); font-weight:300;
      display:flex; align-items:center; justify-content:center;
      padding:16px; padding-block:48px;
      -webkit-font-smoothing:antialiased;
    }
    .caja{max-width:520px; text-align:center}
    .marca{
      width:56px; height:56px; margin:0 auto 32px; border-radius:12px;
      background:#4A2833; color:var(--oro); font-family:var(--serif);
      font-size:34px; line-height:56px;
    }
    h1{
      font-family:var(--serif); font-weight:400; margin:0 0 14px;
      font-size:clamp(30px,7vw,44px); line-height:1.1; text-wrap:balance;
    }
    p{margin:0 0 14px; line-height:1.65; color:var(--mute); font-size:16px}
    strong{color:var(--ink); font-weight:400}
    .acciones{
      display:flex; flex-wrap:wrap; gap:12px; justify-content:center;
      margin-top:32px; padding-top:28px; border-top:1px solid var(--linea);
    }
    .btn{
      display:inline-flex; align-items:center; justify-content:center; gap:8px;
      min-height:44px; padding:12px 24px; border-radius:9999px;
      font-size:14.5px; font-weight:500; text-decoration:none;
      transition:opacity .2s ease;
    }
    .btn:hover{opacity:.85}
    .btn-oro{background:linear-gradient(180deg,#EBD8AE,#C9AE78); color:#2B1D14}
    .btn-borde{border:1px solid var(--linea); color:var(--ink)}
    :focus-visible{outline:2px solid var(--oro); outline-offset:3px}
  </style>
</head>
<body>
  <main class="caja">
    <div class="marca" aria-hidden="true">Q</div>
    <h1>Solicitud recibida</h1>
    <p>Gracias. Hemos recibido tus datos y <strong>te llamamos en menos de 24&nbsp;horas laborables</strong> para concretar la valoración.</p>
    <p>Si prefieres no esperar, puedes escribirnos directamente por WhatsApp.</p>
    <div class="acciones">
      <a class="btn btn-oro" href="https://wa.me/34667545985" target="_blank" rel="noopener">Escribir por WhatsApp</a>
      <a class="btn btn-borde" href="/">Volver a la web</a>
    </div>
  </main>
</body>
</html>
